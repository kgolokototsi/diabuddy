<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DiaBuddy Carb Counter</title>
  <meta name="description" content="Carb counting and insulin dose calculator for the family.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DiaBuddy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Meal -->
    <main class="screen" id="screen-meal" data-screen="meal">
      <header class="nav">
        <p class="eyebrow">DiaBuddy</p>
        <h1 class="large-title">Meal</h1>
      </header>
      <div id="setup-banner"></div>
      <div class="search-bar">
        <label class="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="meal-search" type="search" placeholder="Search foods" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        </label>
      </div>
      <div class="quick-actions">
        <button class="pill-button" data-action="manual">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
          Carbs from a label
        </button>
        <button class="pill-button" data-action="barcode">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>
          Barcode
        </button>
        <button class="pill-button" data-action="correction">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>
          BG correction only
        </button>
      </div>
      <div id="meal-results"></div>
    </main>

    <!-- Foods -->
    <main class="screen" id="screen-foods" data-screen="foods" hidden>
      <header class="nav">
        <p class="eyebrow">DiaBuddy</p>
        <h1 class="large-title">Foods</h1>
      </header>
      <div class="search-bar">
        <label class="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="foods-search" type="search" placeholder="Search all foods" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        </label>
      </div>
      <div class="chips" id="foods-chips" role="tablist" aria-label="Category"></div>
      <div id="foods-admin"></div>
      <div id="foods-results"></div>
    </main>

    <!-- Settings -->
    <main class="screen" id="screen-settings" data-screen="settings" hidden>
      <header class="nav">
        <p class="eyebrow">DiaBuddy</p>
        <h1 class="large-title">Settings</h1>
      </header>
      <div id="settings-body"></div>
    </main>
  </div>

  <!-- Meal tray: draggable sheet above the tab bar -->
  <section class="tray" id="tray" aria-label="This meal" hidden>
    <div class="tray-head" id="tray-head">
      <div class="grabber" aria-hidden="true"></div>
      <div class="tray-summary">
        <button class="tray-toggle" id="tray-toggle" aria-expanded="false">
          <span class="tray-carbs" id="tray-carbs">0 g</span>
          <span class="tray-count" id="tray-count">carbs</span>
        </button>
        <button class="btn btn-primary btn-compact" data-action="calculate">Calculate dose</button>
      </div>
    </div>
    <div class="tray-body" id="tray-body"></div>
  </section>
  <div class="tray-scrim" id="tray-scrim"></div>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="meal" aria-current="page">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8a2 2 0 0 1-2 2M9 3v6M17 21V3c-2 1-3 4-3 8h3"/></svg>
      <span>Meal</span>
    </button>
    <button class="tab" data-tab="foods">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 7c-1.5-2-5-2.2-6.5.5S5 15 7 18s3.5 3 5 2c1.5 1 3 1 5-2s3-8 1.5-10.5S13.5 5 12 7Z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>
      <span>Foods</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <!-- Modal sheet (dose, amounts, admin forms) -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grab" id="sheet-grab"><div class="grabber" aria-hidden="true"></div></div>
    <div class="sheet-content" id="sheet-content"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
